<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailOne - Secure SMS Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgb(0 0 0 / 0.5); }
  </style>
</head>
<body class="bg-gray-950 text-gray-100">

  <div class="flex flex-col md:flex-row min-h-screen">
    <div class="w-full md:w-72 bg-gray-900 p-6 border-b md:border-b-0 md:border-r border-gray-800 flex flex-col justify-between gap-6">
      <div>
        <h1 class="text-3xl font-bold text-orange-500 mb-8 tracking-wide">RailOne</h1>
        
        <div class="bg-gray-800 rounded-2xl p-6 mb-6 border border-gray-700 shadow-inner">
          <p class="text-gray-400 text-xs uppercase tracking-widest font-semibold">Wallet Balance</p>
          <h2 id="topWalletBalance" class="text-3xl font-black mt-2 text-green-400 tracking-tight">₹0.00</h2>
          <p id="sideProfilePhone" class="text-xs text-gray-500 truncate mt-2">Loading User...</p>
        </div>

        <div class="bg-gray-800 rounded-2xl p-6">
          <p class="text-green-400 text-sm font-medium">Selected Service</p>
          <h2 id="displayServiceName" class="text-2xl font-bold mt-1">RailOne</h2>
        </div>
      </div>
      
      <div>
        <a href="dashboard.html" class="flex items-center justify-center gap-2 w-full bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-medium text-sm transition">
          ← Back to Dashboard
        </a>
      </div>
    </div>

    <div class="flex-1 p-6 md:p-10 overflow-auto">
      <div class="max-w-3xl mx-auto space-y-8">
        
        <div>
          <h2 class="text-3xl md:text-4xl font-bold mb-6">Buy Service Number</h2>

          <div class="flex items-center gap-3 mb-8">
            <div class="flex-1 h-1.5 bg-green-500 rounded-full"></div>
            <div class="flex-1 h-1.5 bg-green-500 rounded-full"></div>
            <div class="flex-1 h-1.5 bg-orange-500 rounded-full"></div>
          </div>

          <div class="bg-gray-900 rounded-3xl p-6 md:p-8 card border border-gray-850">
            <div class="space-y-6">
              <div>
                <label class="block text-sm mb-2 text-gray-400">Country</label>
                <div class="bg-gray-800 rounded-2xl p-4 flex items-center gap-4">
                  <span class="text-xl">🇮🇳</span> <span class="font-semibold text-lg">India</span>
                </div>
              </div>

              <div>
                <label class="block text-sm mb-2 text-gray-400">Service</label>
                <div class="bg-gray-800 rounded-2xl p-4 flex items-center gap-4">
                  <span class="text-2xl">🚄</span>
                  <div>
                    <span id="displayServiceTitle" class="font-bold text-lg">RailOne</span>
                    <p class="text-green-400 text-xs font-medium">Single-OTP Mode Secure</p>
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-sm mb-2 text-gray-400">Operator & Rate</label>
                <div class="bg-gray-800 border border-orange-500/50 rounded-2xl p-5">
                  <div class="flex justify-between items-center">
                    <div class="flex items-center gap-4">
                      <div id="operatorBadge" class="w-10 h-10 bg-orange-500 text-white rounded-xl flex items-center justify-center font-bold text-xl">10</div>
                      <div>
                        <p id="operatorName" class="font-bold text-base">Operator 10</p>
                        <p class="text-orange-400 text-xs">High Stability Route</p>
                      </div>
                    </div>
                    <div class="text-right">
                      <p id="displayPrice" class="text-2xl font-bold text-orange-400">₹14.48</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <button onclick="buyRailOne()" id="mainBuyBtn"
                    class="mt-8 w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 py-5 rounded-2xl font-bold text-xl active:scale-[0.99] transition shadow-lg shadow-orange-500/20">
              Buy Number Now
            </button>

            <div id="result" class="mt-6"></div>
          </div>
        </div>

        <div class="bg-gray-900 rounded-3xl border border-gray-800 relative overflow-hidden p-6 card">
          <div class="absolute inset-0 bg-gradient-to-br from-gray-800/10 via-orange-500/5 to-gray-800/10 pointer-events-none"></div>
          
          <div class="relative z-10">
            <div class="flex items-center gap-3 mb-6">
              <div class="w-10 h-10 bg-gradient-to-br from-orange-500/20 to-amber-500/20 rounded-xl flex items-center justify-center border border-orange-500/30">
                <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" class="w-5 h-5 text-orange-400" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
                  <path fill="none" d="M0 0h24v24H0z"></path>
                  <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path>
                </svg>
              </div>
              <h2 class="text-xl font-bold text-gray-100">Active Live Number</h2>
            </div>

            <div id="activeNumbersContainer"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const PROXY_URL = "https://fjseur.sawanenter7209.workers.dev"; 
    const CORS_PROXY = "https://corsproxy.io/?";
    let apiKey = "edc29c86770ab518ad638153ebfacc0d02a1";
    
    // 🔥 Admin Price यहीं से बदल सकते हो
    let numPrice = 14.48; 
    const countryCode = "22";
    const operatorCode = "10";
    const serviceCodes = ["izvo"]; 
    const serviceDisplayName = "RailOne (exSwaRail)";

    let smsIntervals = {};
    let countdownIntervals = {};

    function initStaticUI() {
      document.getElementById('displayServiceName').innerText = serviceDisplayName;
      document.getElementById('displayServiceTitle').innerText = serviceDisplayName;
      document.getElementById('displayPrice').innerText = `₹${numPrice.toFixed(2)}`;
      document.getElementById('operatorBadge').innerText = operatorCode;
      document.getElementById('operatorName').innerText = `Operator ${operatorCode}`;
    }

    async function loadDashboardWallet() {
      const sessionPhone = localStorage.getItem("phone");
      if (!sessionPhone) return 0;
      document.getElementById('sideProfilePhone').innerText = `+91 ${sessionPhone}`;

      try {
        const res = await fetch(`${PROXY_URL}/db/demoWallet/${sessionPhone}`);
        const balance = await res.json();
        const activeBalance = parseFloat(balance) || 0;
        document.getElementById('topWalletBalance').innerText = `₹${activeBalance.toFixed(2)}`;
        return activeBalance;
      } catch (e) {
        return 0;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initStaticUI();
      loadDashboardWallet();
      renderActiveNumbers();
    });

    async function apiCall(action, params = {}) {
      let url = `https://api.numerasms.com/stubs/handler_api.php?api_key=${apiKey}&action=${action}&_t=${Date.now()}`;
      Object.keys(params).forEach(key => url += `&${key}=${params[key]}`);
      return fetch(CORS_PROXY + encodeURIComponent(url)).then(r => r.text()).catch(() => "Error");
    }

    async function buyRailOne() {
      const resultDiv = document.getElementById('result');
      const mainBuyBtn = document.getElementById('mainBuyBtn');
      const sessionPhone = localStorage.getItem("phone");

      if (!sessionPhone) {
        alert("Session expired!");
        return;
      }

      mainBuyBtn.disabled = true;
      resultDiv.innerHTML = `<p class="text-yellow-400 animate-pulse">Checking balance...</p>`;

      if (await loadDashboardWallet() < numPrice) {
        resultDiv.innerHTML = `<p class="text-red-400 font-bold">❌ अपर्याप्त बैलेंस!</p>`;
        mainBuyBtn.disabled = false;
        return;
      }

      resultDiv.innerHTML = `<p class="text-yellow-400 animate-pulse">API से नंबर ले रहे हैं...</p>`;

      for (let service of serviceCodes) {
        const result = await apiCall('getNumberV2', { service, country: countryCode, operator: operatorCode });
        const clean = result.trim();
        console.log("API Response:", clean);

        if (!clean || clean.includes("NO_NUMBERS") || clean.includes("BAD")) continue;

        let orderId = "", displayNum = "";

        if (clean.startsWith("{")) {
          try {
            const json = JSON.parse(clean);
            orderId = json.activationId || json.id;
            displayNum = json.phoneNumber || json.number;
          } catch(e) {}
        } else if (clean.includes(":")) {
          const parts = clean.split(":");
          orderId = parts[1] || parts[0];
          displayNum = parts[2] || parts[1];
        }

        if (!orderId || !displayNum) continue;

        displayNum = String(displayNum);
        if (displayNum.startsWith("91") && displayNum.length > 10) {
          displayNum = displayNum.substring(2);
        }

        // Wallet Deduct
        try {
          await fetch(`${PROXY_URL}/db/deduct?phone=${sessionPhone}&amount=${numPrice}`);
        } catch(e) {}

        const freshNumObj = {
          id: orderId,
          number: displayNum,
          service: service,
          expiryTime: Date.now() + 15 * 60 * 1000,   // 15 मिनट
          sms: []
        };

        let allNumbers = JSON.parse(localStorage.getItem("purchasedNumbers")) || [];
        allNumbers.unshift(freshNumObj);
        localStorage.setItem("purchasedNumbers", JSON.stringify(allNumbers));

        console.log("✅ Number Saved:", freshNumObj);

        renderActiveNumbers();
        startSMSPollingForId(orderId);
        startTimerForId(orderId, freshNumObj.expiryTime);
        await loadDashboardWallet();

        resultDiv.innerHTML = `<p class="text-green-400 font-bold">✅ नंबर सफलतापूर्वक लिया गया!</p>`;
        setTimeout(() => resultDiv.innerHTML = "", 3000);

        mainBuyBtn.disabled = false;
        return;
      }

      resultDiv.innerHTML = `<p class="text-red-400">❌ No number available. Try again.</p>`;
      mainBuyBtn.disabled = false;
    }

    function renderActiveNumbers() {
      const container = document.getElementById("activeNumbersContainer");
      let numbers = JSON.parse(localStorage.getItem("purchasedNumbers")) || [];

      if (numbers.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 border-2 border-dashed border-gray-700 rounded-2xl bg-gray-950/50">
            <p class="text-gray-400">कोई सक्रिय नंबर नहीं है। ऊपर से खरीदें।</p>
          </div>`;
        return;
      }

      let html = `<div class="space-y-4">`;
      numbers.forEach(item => {
        const isOtpReceived = Array.isArray(item.sms) && item.sms.length > 0;
        const timeLeft = item.expiryTime ? item.expiryTime - Date.now() : 0;
        const showDelete = (timeLeft <= 13 * 60 * 1000) && !isOtpReceived && timeLeft > 0;

        html += `
          <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5">
            <div class="flex justify-between items-start">
              <div>
                <p class="text-2xl font-bold tracking-wider">+91 ${item.number}</p>
                <p class="text-xs text-gray-500">ID: ${item.id}</p>
              </div>
              <button onclick="copyToClipboard('${item.number}')" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm">📋 Copy</button>
            </div>
            
            <div class="mt-4">
              ${isOtpReceived ? 
                `<div class="p-4 bg-emerald-900/50 border border-emerald-500 rounded-xl text-emerald-300 font-bold">OTP: ${extractOTP(item.sms[0])}</div>` : 
                `<p class="text-amber-400 animate-pulse">Waiting for OTP...</p>`
              }
            </div>
            
            <p class="text-xs text-gray-500 mt-3">Expire: <span id="timer-${item.id}" class="text-orange-400 font-bold">15:00</span></p>
            
            ${showDelete ? `
              <button onclick="deleteAndRefund('${item.id}')" 
                      class="mt-4 px-5 py-2 bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white rounded-xl text-sm font-bold transition">
                ❌ Cancel & Refund
              </button>` : ''}
          </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    function extractOTP(text) {
      if (!text) return "";
      const match = text.match(/\b\d{4,6}\b/);
      return match ? match[0] : text;
    }

    function copyToClipboard(num) {
      navigator.clipboard.writeText(num);
      alert("Copied: +91" + num);
    }

    function startTimerForId(id, expiryTime) {
      if (countdownIntervals[id]) clearInterval(countdownIntervals[id]);

      countdownIntervals[id] = setInterval(() => {
        const left = expiryTime - Date.now();
        if (left <= 0) {
          deleteAndRefund(id, true);
          return;
        }

        const min = Math.floor(left / 60000);
        const sec = Math.floor((left % 60000) / 1000);
        const el = document.getElementById(`timer-${id}`);
        if (el) el.textContent = `${min}:${sec.toString().padStart(2, '0')}`;

        renderActiveNumbers(); // Update delete button visibility
      }, 1000);
    }

    function startSMSPollingForId(id) {
      if (smsIntervals[id]) clearInterval(smsIntervals[id]);
      smsIntervals[id] = setInterval(() => checkSMS(id), 5000);
    }

    async function checkSMS(id) {
      // Add your actual SMS checking logic here later
      console.log("Checking SMS for:", id);
    }

    async function deleteAndRefund(id, isAuto = false) {
      let numbers = JSON.parse(localStorage.getItem("purchasedNumbers")) || [];
      let index = numbers.findIndex(n => n.id === id);
      if (index === -1) return;

      const item = numbers[index];
      if (Array.isArray(item.sms) && item.sms.length > 0 && !isAuto) {
        return; // OTP आ चुका है तो refund नहीं
      }

      // API Cancel
      await apiCall('setStatus', { id: id, status: '8' });

      // Wallet Refund
      const sessionPhone = localStorage.getItem("phone");
      if (sessionPhone) {
        try {
          await fetch(`${PROXY_URL}/db/deduct?phone=${sessionPhone}&amount=-${numPrice}`);
        } catch(e) {}
      }

      // Remove Number
      numbers.splice(index, 1);
      localStorage.setItem("purchasedNumbers", JSON.stringify(numbers));

      if (smsIntervals[id]) clearInterval(smsIntervals[id]);
      if (countdownIntervals[id]) clearInterval(countdownIntervals[id]);

      renderActiveNumbers();
      loadDashboardWallet();
    }
  </script>
</body>
</html>
